
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <title>Dynamic OFC Ring Diagram</title>

    <style>
        .main-ring-line { stroke: #0077b6; stroke-width: 3; fill: none; }
        .child-ring-line { stroke: #00b894; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
        .node { fill: #d63031; stroke: white; stroke-width: 1.5; }
        .node-label { font-family: Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
        .ring-label { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #555; text-anchor: middle; }
    </style>

    <polyline 
        class="main-ring-line" 
        points="400,50 183,175 183,425 400,550 617,425 617,175 400,50" 
    />
    <text x="400.0" y="80.0" class="ring-label">R1 (Main Ring)</text>

    
    <path 
        class="child-ring-line" 
        d="M 183,175 L 113,300 L 183,425" 
    />
    <text x="113" y="290" class="node-label" style="fill: #00b894; font-weight: bold;">R1-C1</text>

    <path 
        class="child-ring-line" 
        d="M 400,550 L 558,574 L 617,425" 
    />
    <text x="558" y="564" class="node-label" style="fill: #00b894; font-weight: bold;">R1-C2</text>

    <path 
        class="child-ring-line" 
        d="M 617,175 L 573,0 L 400,50" 
    />
    <text x="573" y="-10" class="node-label" style="fill: #00b894; font-weight: bold;">R1-C3</text>

    

    <circle class="node" cx="400" cy="50" r="8" />
    <text class="node-label" x="400" y="35">A</text>

    <circle class="node" cx="183" cy="175" r="8" />
    <text class="node-label" x="183" y="160">B</text>

    <circle class="node" cx="183" cy="425" r="8" />
    <text class="node-label" x="183" y="410">C</text>

    <circle class="node" cx="400" cy="550" r="8" />
    <text class="node-label" x="400" y="535">D</text>

    <circle class="node" cx="617" cy="425" r="8" />
    <text class="node-label" x="617" y="410">E</text>

    <circle class="node" cx="617" cy="175" r="8" />
    <text class="node-label" x="617" y="160">F</text>

</svg>